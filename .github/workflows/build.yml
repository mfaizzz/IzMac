name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: scripts/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: IzMac
          path: build/IzMac.zip
